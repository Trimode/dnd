<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Comprehensive Combat Engine & AoE Targeting Test Suite</title>
</head>
<body>
  <div id="combat-mount"></div>
  <div id="test-results" style="white-space: pre-wrap; font-family: monospace; padding: 20px;"></div>

  <!-- Load Dashboard Bundle -->
  <script src="js/bundle.js"></script>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const results = [];
      function assert(condition, message) {
        if (condition) {
          results.push("[PASS] " + message);
        } else {
          results.push("[FAIL] " + message);
          console.error("Assertion failed: " + message);
        }
      }

      try {
        const mount = document.getElementById('combat-mount');
        if (typeof renderCombatView !== 'function') {
          results.push("[FAIL] renderCombatView is not defined or exported on window");
          document.getElementById('test-results').innerText = results.join('\n');
          return;
        }

        renderCombatView(mount);
        const ctrl = mount._combatController || window._lastCombatController;
        assert(ctrl !== undefined, "Combat controller initialized and accessible");

        const { cState, ABILITIES, BESTIARY, rollInitiative, advanceTurn, endCombat, handleDmResolveCurrent, isHostile, performWeaponAttack, executeAbility, updateActionUi } = ctrl;

        // Enable DM mode (full authority for DM)
        worldState.setDmMode(true);

        // ----------------------------------------------------
        // TEST 1: Unit Identification and Hostility Logic
        // ----------------------------------------------------
        const goblin = cState.entities.find(e => e.team === 'enemy' && e.name.toLowerCase().includes('goblin'));
        const player = cState.entities.find(e => e.team === 'player');
        assert(goblin !== undefined, "Enemy unit found on map: " + goblin.name);
        assert(player !== undefined, "Player unit found on map: " + player.name);

        assert(isHostile(goblin, player) === true, "isHostile(enemy, player) evaluates to TRUE (enemy can target player)");
        assert(isHostile(player, goblin) === true, "isHostile(player, enemy) evaluates to TRUE (player can target enemy)");
        assert(isHostile(player, player) === false, "isHostile(player, player) evaluates to FALSE (ally targeting)");

        // ----------------------------------------------------
        // TEST 2: Enemy Targets Player with Single-Target Spells & Attacks
        // ----------------------------------------------------
        player.hp = player.maxHp;
        cState.selectedEntity = goblin;
        updateActionUi();
        const initialPlayerHp = player.hp;

        // 2a. Enemy attacks player
        performWeaponAttack(goblin, player);
        assert(player.hp <= initialPlayerHp, "Enemy Attack against Player successfully resolved (Player HP: " + initialPlayerHp + " -> " + player.hp + ")");

        // 2b. Enemy casts Magic Missile on player (auto-hit force damage)
        const playerHpBeforeMM = player.hp;
        executeAbility(goblin, 'magic_missile', player);
        assert(player.hp < playerHpBeforeMM, "Enemy cast Magic Missile on Player successfully deducted HP (Player HP: " + playerHpBeforeMM + " -> " + player.hp + ")");

        // 2c. Enemy casts Ember Hex on player (saving throw based)
        executeAbility(goblin, 'ember_hex', player);
        assert(true, "Enemy cast Ember Hex on Player triggered saving throw & damage resolution without errors");

        // ----------------------------------------------------
        // TEST 3: Universal Spell Select & Fireball Dropdown Option
        // ----------------------------------------------------
        const spellSelectElem = mount.querySelector('#combat-spell-select');
        assert(spellSelectElem !== null, "#combat-spell-select dropdown exists in DOM");

        const fireballOption = Array.from(spellSelectElem.options).find(opt => opt.value === 'fireball');
        assert(fireballOption !== undefined, "Fireball is selectable in the dropdown for Goblin / any unit");

        // Selecting Fireball from dropdown automatically switches action to CAST
        spellSelectElem.value = 'fireball';
        spellSelectElem.dispatchEvent(new Event('change'));

        assert(cState.selectedSpellId === 'fireball', "cState.selectedSpellId is set to 'fireball'");
        assert(cState.selectedAction === 'CAST', "Selecting Fireball from dropdown automatically activated cState.selectedAction = 'CAST'");

        // ----------------------------------------------------
        // TEST 4: Dynamic Hover AoE Radius Preview
        // ----------------------------------------------------
        const canvas = mount.querySelector('#battlefield-canvas');
        assert(canvas !== null, "Battlefield canvas element exists");

        // Simulate hovering over grid square (5, 5)
        const rect = canvas.getBoundingClientRect();
        const mouseMoveEvent = new MouseEvent('mousemove', {
          clientX: rect.left + 5 * 50 + 25,
          clientY: rect.top + 5 * 50 + 25,
          bubbles: true
        });
        canvas.dispatchEvent(mouseMoveEvent);

        assert(cState.hoveredTile !== null, "cState.hoveredTile updated on mousemove");
        assert(cState.hoveredTile.x === 5 && cState.hoveredTile.y === 5, "Point of origin hovered tile is exact: (5, 5)");

        const fireball = ABILITIES['fireball'];
        assert(fireball !== undefined && fireball.kind === 'aoe', "Fireball ability is marked as AoE");
        assert(fireball.radius === 4, "Fireball AoE has radius = 4 tiles (20ft sphere)");
        assert(fireball.range === 30, "Fireball has range = 30 tiles (150ft)");

        // ----------------------------------------------------
        // TEST 5: Free-Square AoE Ground Targeting (No Unit Target Required)
        // ----------------------------------------------------
        // Reset player HP and position within blast radius at (4, 5) while target square is EMPTY (5, 5)
        player.hp = player.maxHp;
        player.x = 4;
        player.y = 5;
        const hpBeforeFireball = player.hp;

        // Click empty square (5, 5) to cast Fireball at that ground coordinate
        const clickEvent = new MouseEvent('click', {
          clientX: rect.left + 5 * 50 + 25,
          clientY: rect.top + 5 * 50 + 25,
          bubbles: true
        });
        canvas.dispatchEvent(clickEvent);

        assert(player.hp < hpBeforeFireball, "Fireball cast on EMPTY ground square (5,5) successfully hit creatures within 4-tile radius (HP: " + hpBeforeFireball + " -> " + player.hp + ")");

        const hasAoeEffect = cState.effects.some(eff => eff.kind === 'aoe' && eff.gx === 5 && eff.gy === 5);
        assert(hasAoeEffect === true, "Ground-targeted Fireball cast at (5,5) created AoE blast effect on canvas");

        // ----------------------------------------------------
        // TEST 6: Initiative & Individual Turn Resolution
        // ----------------------------------------------------
        cState.entities.forEach(e => e.hp = e.maxHp);
        rollInitiative();
        assert(cState.combat.active === true, "Combat activated after rollInitiative()");
        assert(cState.combat.round === 1, "Combat starts in Round 1");
        assert(cState.combat.order.length >= 2, "Initiative order contains " + cState.combat.order.length + " combatants");

        const initialIdx = cState.combat.turnIndex;
        advanceTurn();
        const nextIdx = cState.combat.turnIndex;
        assert(nextIdx !== initialIdx, "advanceTurn() correctly moved turn index from " + initialIdx + " to " + nextIdx);

        // ----------------------------------------------------
        // TEST 7: DM Resolving Turn for Away/Absent Player
        // ----------------------------------------------------
        const pOrderIdx = cState.combat.order.findIndex(id => {
          const u = cState.entities.find(e => e.id === id);
          return u && u.team === 'player';
        });

        if (pOrderIdx !== -1) {
          cState.combat.turnIndex = pOrderIdx;
          const awayPlayer = cState.entities.find(e => e.id === cState.combat.order[pOrderIdx]);
          handleDmResolveCurrent();
          assert(true, "DM Resolve executed for away player: " + awayPlayer.name);
        }

        // ----------------------------------------------------
        // TEST 8: Combat Action Log Verification
        // ----------------------------------------------------
        const logStream = mount.querySelector('#combat-log-stream');
        assert(logStream !== null, "Combat & Dice Roll Log stream exists in DOM");
        const logText = logStream.innerText;
        assert(logText.includes('Fireball centred on (5, 5)') || logText.includes('Fireball'), "Action log contains detailed Fireball ground detonation and damage entries");

        // ----------------------------------------------------
        // TEST 9: End Combat Reset
        // ----------------------------------------------------
        endCombat();
        assert(cState.combat.active === false, "endCombat() cleanly deactivates combat and resets initiative");

        const passed = results.filter(r => r.startsWith('[PASS]')).length;
        const total = results.length;
        results.push("\n==========================================");
        results.push("ALL FUNCTIONAL TESTS PASSED: (" + passed + "/" + total + ")");
        results.push("==========================================");

      } catch (err) {
        results.push("[ERROR] " + err.message + "\n" + err.stack);
      }

      document.getElementById('test-results').innerText = results.join('\n');
    });
  </script>
</body>
</html>

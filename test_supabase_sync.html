<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Supabase Sync & Efficiency Tests</title>
</head>
<body>
  <div id="test-results" style="white-space: pre-wrap; font-family: monospace; padding: 20px;"></div>

  <!-- Load Dashboard Bundle -->
  <script src="js/bundle.js?v=1.2"></script>

  <script>
    (async function() {
      const results = [];
      function assert(condition, message) {
        if (condition) {
          results.push("[PASS] " + message);
        } else {
          results.push("[FAIL] " + message);
          console.error("Assertion failed: " + message);
        }
      }

      try {
        // 1. Verify supabaseDb exports & methods
        assert(typeof window.supabaseDb === 'object' && window.supabaseDb !== null, "window.supabaseDb is exposed");
        assert(typeof supabaseDb.fetchCampaigns === 'function', "supabaseDb.fetchCampaigns exists");
        assert(typeof supabaseDb.verifyCampaignPassword === 'function', "supabaseDb.verifyCampaignPassword exists");
        assert(typeof supabaseDb.loadCampaignData === 'function', "supabaseDb.loadCampaignData exists");
        assert(typeof supabaseDb.loadTableSlice === 'function', "supabaseDb.loadTableSlice (targeted Realtime reload) exists");
        assert(typeof supabaseDb.syncCampaignData === 'function', "supabaseDb.syncCampaignData exists");
        assert(typeof supabaseDb.subscribeRealtime === 'function', "supabaseDb.subscribeRealtime exists");

        // 2. Verify lossless DB <-> App row mapping round-trips
        const sampleChar = {
          id: 'pc-test-1',
          name: 'Aelindra Starweaver',
          playerName: 'Sam',
          ownerUserId: 'user-1',
          level: 5,
          species: 'Elf',
          classRole: 'Wizard',
          alignment: 'Neutral Good',
          background: 'Sage',
          originFeat: 'Magic Initiate (Wizard)',
          avatar: 'AS',
          hpCurrent: 32,
          hpMax: 32,
          tempHp: 5,
          ac: 15,
          speed: '30 ft',
          initiativeMod: '+3',
          passivePerception: 14,
          passiveInsight: 12,
          inspiration: true,
          stats: { str: 8, dex: 16, con: 14, int: 18, wis: 12, cha: 10 },
          weaponMasteries: ['Slow (Quarterstaff)'],
          entryPoint: { regionId: 'region-foregrove', locationName: 'Canopy Spire' }
        };
        const dbChar = supabaseDb.mapCharacterToDb(sampleChar, 'demo');
        const roundTripChar = supabaseDb.mapCharacterFromDb(dbChar);
        assert(roundTripChar.id === sampleChar.id && roundTripChar.name === sampleChar.name, "Character mapper preserves id and name");
        assert(roundTripChar.stats.int === 18 && roundTripChar.tempHp === 5 && roundTripChar.inspiration === true, "Character mapper preserves stats, tempHp, inspiration");
        assert(roundTripChar.entryPoint && roundTripChar.entryPoint.locationName === 'Canopy Spire', "Character mapper preserves nested details JSONB");

        const sampleMsg = { id: 'm1', senderName: 'DM', senderAvatar: 'DM', senderRole: 'DM', type: 'dm_narration', text: 'Roll initiative!', timeStr: '12:00' };
        const roundTripMsg = supabaseDb.mapMessageFromDb(supabaseDb.mapMessageToDb(sampleMsg, 'demo'));
        assert(roundTripMsg.text === 'Roll initiative!' && roundTripMsg.type === 'dm_narration', "Social message mapper round-trips cleanly");

        const sampleRoll = { id: 'r1', rollerName: 'Theron', rollerAvatar: 'TH', rollType: 'attack', label: 'Greataxe', formula: '1d20+7', d20Result: 20, total: 27, dc: 16, success: true, isCrit: true, isNat1: false, advantageMode: 'normal', note: 'Nat 20!', timeStr: '12:01:00' };
        const roundTripRoll = supabaseDb.mapRollFromDb(supabaseDb.mapRollToDb(sampleRoll, 'demo'));
        assert(roundTripRoll.total === 27 && roundTripRoll.isCrit === true && roundTripRoll.success === true, "Dice roll mapper round-trips cleanly");

        // 3. Verify diff-snapshot tracking for efficient dirty-only sync
        supabaseDb.recordSnapshots('demo', worldState.data);
        const snap = supabaseDb.getSnapshotMap('demo');
        assert(typeof snap.partyCharacters === 'string' && snap.partyCharacters.length > 2, "Diff snapshot tracks partyCharacters");
        assert(typeof snap['lore:regions'] === 'string' && snap['lore:regions'].length > 2, "Diff snapshot tracks per-category lore");

        // 4. Verify worldState cloud hooks & single-notify efficiency
        assert(typeof worldState.initCloud === 'function', "worldState.initCloud exists");
        assert(typeof worldState.verifyGamePasswordAsync === 'function', "worldState.verifyGamePasswordAsync exists");
        assert(typeof worldState.subscribeCloudStatus === 'function', "worldState.subscribeCloudStatus exists");

        let notifyCount = 0;
        const unsub = worldState.subscribe(() => { notifyCount++; });
        worldState.createPartyCharacter({
          name: 'Efficiency Test Hero',
          level: 1,
          species: 'Human',
          classRole: 'Fighter',
          stats: { str: 15, dex: 14, con: 13, int: 12, wis: 10, cha: 8 }
        });
        unsub();
        assert(notifyCount === 1, "createPartyCharacter triggers exactly 1 notify() re-render (was: " + notifyCount + ")");

        // 5. Verify index.html has pinned Supabase CDN & cloud sync indicator
        const res = await fetch('index.html');
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const cloudBadge = doc.getElementById('cloud-sync-indicator');
        assert(cloudBadge !== null, "#cloud-sync-indicator badge exists in index.html");
        const sbScript = doc.querySelector('script[src*="@supabase/supabase-js@2.49.4"]');
        assert(sbScript !== null, "Pinned @supabase/supabase-js@2.49.4 script tag present in index.html");
        const verEl = doc.getElementById('app-version-indicator');
        assert(verEl && verEl.textContent.trim() === 'v1.2', "Version indicator updated to v1.2");

        const passed = results.filter(r => r.startsWith('[PASS]')).length;
        const total = results.length;
        results.push("\n==========================================");
        results.push("SUPABASE SYNC & EFFICIENCY TESTS PASSED: (" + passed + "/" + total + ")");
        results.push("==========================================");

        document.getElementById('test-results').innerText = results.join('\n');
      } catch (err) {
        results.push("[ERROR] " + err.message + "\n" + err.stack);
        document.getElementById('test-results').innerText = results.join('\n');
      }
    })();
  </script>
</body>
</html>
